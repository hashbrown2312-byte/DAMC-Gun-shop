<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weapon Crafting Calculator</title>
<style>
body{margin:0;background:#090b10;color:#eee;font-family:system-ui;padding:24px}main{max-width:1000px;margin:auto}
.box{background:#121722;border:1px solid #293244;border-radius:14px;padding:18px;margin:12px 0}
select,input,button{padding:11px;border-radius:9px;border:1px solid #334052;background:#0b1018;color:#fff;font-size:15px}
button{background:#7c3aed;border:0;font-weight:700;cursor:pointer}.controls{display:grid;grid-template-columns:1fr 130px 150px;gap:10px}
.mats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.mat{background:#0b1018;border:1px solid #293244;border-radius:8px;padding:10px}.muted{color:#9aa4b2}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid #293244;border-radius:9px;margin:8px 0;background:#171d28}
.tabs{display:flex;gap:8px}.hide{display:none}@media(max-width:650px){.controls{grid-template-columns:1fr}}
</style></head><body><main>
<h1>🔫 Weapon Crafting Calculator</h1><p class="muted">Choose an item, set crafts, and calculate combined materials.</p>
<div class="tabs"><button onclick="tab(0)">Calculator</button><button onclick="tab(1)">All Recipes</button></div>
<section id="c" class="box"><div class="controls"><select id="s"></select><input id="q" type="number" min="1" value="1"><button onclick="add()">Add to Build</button></div>
<div id="p"></div><h2>Build Queue</h2><button onclick="clearQ()">Clear</button><div id="queue"></div><h2>Total Materials</h2><div id="t" class="mats"></div></section>
<section id="r" class="box hide"><input id="search" placeholder="Search..." oninput="all(this.value)"><div id="list"></div></section>
</main><script>
const D={"Ammo":{"9mm Ammo Box":[10,{"Aluminium":50,"Copper":50,"Iron":50}],"9mm Ammo":[10,{"Aluminium":5,"Copper":5,"Iron":5}],"7.62 Ammo Box":[10,{"Aluminium":50,"Copper":50,"Iron":50}],"7.62 Ammo":[10,{"Aluminium":50,"Copper":50,"Iron":50}],"5.56 Ammo Box":[10,{"Aluminium":50,"Copper":50,"Iron":50}],"5.56 Ammo":[10,{"Aluminium":5,"Copper":5,"Iron":5}],"12 Gauge Ammo":[10,{"Aluminium":5,"Copper":5,"Iron":5}]},"ARP1":{"White-Out ARP":[1,{"Iron":350,"Steel":350,"Iron Powder":250,"Metal Scrap":400}],"FN-15 Pistol":[1,{"Iron":350,"Steel":350,"Iron Powder":250,"Metal Scrap":400}],"Red Drag ARP":[1,{"Iron":350,"Steel":350,"Iron Powder":250,"Metal Scrap":400}]},"Stage 3":{"Zip Tie M4A1":[1,{"Diamond Bolt":1,"Iron Powder":246,"Iron":408,"Steel":365,"Plastic":175,"Metal Scrap":444}],"MK47":[1,{"Diamond Bolt":1,"Iron Powder":246,"Iron":408,"Steel":365,"Plastic":175,"Metal Scrap":444}],"Red Drag M4A1":[1,{"Diamond Bolt":1,"Iron Powder":246,"Iron":408,"Steel":365,"Plastic":175,"Metal Scrap":444}],"RAM-7 Knight":[1,{"Diamond Bolt":1,"Iron Powder":246,"Iron":408,"Steel":365,"Plastic":175,"Metal Scrap":444}],"Ruger":[1,{"Iron":40,"Steel":50,"Iron Powder":300,"Metal Scrap":45}],"UDP-9":[1,{"Iron":350,"Steel":350,"Iron Powder":250,"Metal Scrap":400}],"G 18C":[1,{"Iron":40,"Steel":50,"Iron Powder":30,"Metal Scrap":45}],"RAM-7":[1,{"Diamond Bolt":1,"Iron Powder":246,"Iron":408,"Steel":365,"Plastic":175,"Metal Scrap":444}],"Pit Viper":[1,{"Iron":400,"Steel":50,"Iron Powder":300,"Metal Scrap":45}],"Tactical ARP 9mm":[1,{"Iron":350,"Steel":350,"Iron Powder":250,"Metal Scrap":400}],"Canik TP9SF":[1,{"Iron":40,"Steel":50,"Iron Powder":30,"Metal Scrap":45}],"Model 680":[1,{"Diamond Bolt":2,"Iron Powder":646,"Gold Bolt":2,"Iron":608,"Steel":385,"Plastic":575,"Metal Scrap":444}],"Taurus GX4":[1,{"Iron":40,"Steel":50,"Iron Powder":30,"Metal Scrap":45}],"XDM Elite":[1,{"Iron":40,"Steel":50,"Iron Powder":30,"Metal Scrap":450}]},"Attachments":{"9mm Extended Mag":[1,{"Aluminium":500,"Rubber":500,"Plastic":500}],"7.62 Extended Mag":[1,{"Aluminium":750,"Rubber":750,"Plastic":750}],"5.56 Extended Mag":[1,{"Aluminium":750,"Rubber":750,"Plastic":750}]},"Weapons 1":{"G19X Desert":[1,{"Iron":40,"Steel":50,"Iron Powder":30,"Metal Scrap":45}],"G19X XL":[1,{"Aluminium":15,"Rubber":10,"Copper":20,"Iron":10}],"Pistol":[1,{"Aluminium":15,"Rubber":10,"Copper":20,"Iron":10}],"Hellcat RDP":[1,{"Aluminium":15,"Rubber":10,"Copper":20,"Iron":10}],"H&K P30L":[1,{"Iron":80,"Steel":105,"Iron Powder":65,"Metal Scrap":95}],"G21":[1,{"Aluminium":15,"Rubber":10,"Copper":20,"Iron":10}],"G41":[1,{"Iron":40,"Steel":50,"Iron Powder":30,"Metal Scrap":45}],"Ruger SR40":[1,{"Iron":80,"Steel":105,"Iron Powder":65,"Metal Scrap":95}],"Tan G19":[1,{"Iron":80,"Steel":105,"Iron Powder":65,"Metal Scrap":95}],"Pistol .50":[1,{"Iron":25,"Steel":10,"Iron Powder":15,"Metal Scrap":20}],"XDS9":[1,{"Aluminium":15,"Rubber":10,"Copper":20,"Iron":10}],"Heavy Pistol":[1,{"Iron":20,"Steel":20,"Rubber":2,"Aluminium":15}],"MG G":[1,{"Iron":40,"Steel":50,"Iron Powder":30,"Metal Scrap":45}],"Combat Pistol":[1,{"Aluminium":15,"Rubber":5,"Copper":20,"Iron":10}],"P210 Carry":[1,{"Iron":80,"Steel":105,"Iron Powder":65,"Metal Scrap":95}],"FN Five-Seven":[1,{"Iron":80,"Steel":105,"Iron Powder":65,"Metal Scrap":95}],"Revolver MK2":[1,{"Iron":70,"Steel":95,"Aluminium Powder":45,"Metal Scrap":75}],"Tan 1911":[1,{"Iron":80,"Steel":105,"Iron Powder":65,"Metal Scrap":95}]},"SMG1":{"SMG":[1,{"Iron":580,"Steel":405,"Iron Powder":465,"Metal Scrap":395}],"Black Thompson":[1,{"Iron":980,"Steel":705,"Iron Powder":865,"Metal Scrap":695}],"Machine Pistol":[1,{"Iron":580,"Steel":405,"Iron Powder":465,"Metal Scrap":395}],"Tec 9 W Strap":[1,{"Iron":400,"Steel":350,"Iron Powder":250,"Metal Scrap":350}],"Micro SMG":[1,{"Iron":580,"Steel":405,"Iron Powder":465,"Metal Scrap":395}],"SMG MK2":[1,{"Iron":580,"Steel":405,"Iron Powder":465,"Metal Scrap":395}]}},I=[];Object.entries(D).forEach(([cat,items])=>Object.entries(items).forEach(([name,v])=>I.push({cat,name,out:v[0],m:v[1]})));
const s=document.getElementById("s"),q=document.getElementById("q"),p=document.getElementById("p"),queue=document.getElementById("queue"),t=document.getElementById("t");let Q=[];
I.forEach((x,i)=>s.add(new Option(x.cat+" — "+x.name,i)));
const n=x=>Number(x).toLocaleString();
function preview(){const x=I[+s.value],z=Math.max(1,+q.value||1);p.innerHTML=`<div class="box"><h2>${x.name}</h2><span class="muted">${x.cat} · Output: ${n(x.out*z)}×</span><div class="mats">${Object.entries(x.m).map(([k,v])=>`<div class="mat"><b>${k}</b><br>${n(v*z)}×</div>`).join("")}</div></div>`}
function render(){queue.innerHTML=Q.length?Q.map((x,i)=>`<div class="row"><span><b>${x.name}</b><br><small class="muted">${x.qty} craft → ${n(x.out*x.qty)}×</small></span><button onclick="Q.splice(${i},1);render()">Remove</button></div>`).join(""):"<span class=\"muted\">Nothing added.</span>";const T={};Q.forEach(x=>Object.entries(x.m).forEach(([k,v])=>T[k]=(T[k]||0)+v*x.qty));t.innerHTML=Object.entries(T).map(([k,v])=>`<div class="mat"><b>${k}</b><br>${n(v)}×</div>`).join("")||"<span class=\"muted\">Add items to see totals.</span>"}
function add(){const x=I[+s.value],z=Math.max(1,+q.value||1);Q.push({...x,qty:z});render()}
function clearQ(){Q=[];render()}
function tab(x){document.getElementById("c").classList.toggle("hide",x);document.getElementById("r").classList.toggle("hide",!x)}
function all(f=""){f=f.toLowerCase();document.getElementById("list").innerHTML=Object.entries(D).map(([cat,items])=>{const a=Object.entries(items).filter(([nm,v])=>(cat+" "+nm+" "+Object.keys(v[1]).join(" ")).toLowerCase().includes(f));return a.length?`<h2>${cat}</h2>`+a.map(([nm,v])=>`<div class="box"><h3>${nm}</h3><span class="muted">Output: ${v[0]}× per craft</span><div class="mats">${Object.entries(v[1]).map(([k,z])=>`<div class="mat"><b>${k}</b><br>${n(z)}×</div>`).join("")}</div></div>`).join(""):""}).join("")}
s.onchange=q.oninput=preview;preview();render();all();
</script></body></html>
